name: Test and build KOL

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Concurrent storage checks
        if: runner.os == 'Linux'
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build portable Windows executable
        env:
          KOL_REF_NAME: ${{ github.ref_name }}
          KOL_REF_TYPE: ${{ github.ref_type }}
        run: |
          version=0.1.0
          if [ "$KOL_REF_TYPE" = tag ]; then version="${KOL_REF_NAME#v}"; fi
          ./scripts/build.sh "$version"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/
          cd dist
          zip KOL-windows-amd64.zip KOL.exe README.md LICENSE THIRD_PARTY_NOTICES.md
          sha256sum KOL.exe KOL-windows-amd64.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: KOL-windows-amd64
          path: |
            dist/KOL-windows-amd64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          KOL_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$KOL_RELEASE_TAG" dist/KOL-windows-amd64.zip dist/SHA256SUMS.txt --verify-tag --title "KOL ${KOL_RELEASE_TAG#v}" --generate-notes
